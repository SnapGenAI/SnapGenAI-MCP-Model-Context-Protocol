name: CI

on:
  push:
    branches: ["**"]   # every branch, so work is tested before any pull request exists
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python }}" = "3.12" ]; then
            # The version the image uses: install exactly what the lock pins.
            pip install --require-hashes --no-deps -r requirements-dev.lock
            pip install --no-deps -e .
          else
            # Other versions: unpinned, to catch breakage from newer releases.
            pip install -e ".[dev]"
          fi
      - name: Run tests
        run: python -m pytest -q

  lock:
    name: Lock files match pyproject.toml
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-resolve with the existing pins and fail on any difference
        run: |
          # Same pip and pip-tools as the ones that generated the locks, so formatting cannot differ by version.
          pip install pip==25.0.1 pip-tools==7.6.2
          pip-compile --quiet --generate-hashes --strip-extras -o requirements.lock pyproject.toml
          pip-compile --quiet --generate-hashes --strip-extras --extra dev -o requirements-dev.lock pyproject.toml
          git diff --exit-code -- requirements.lock requirements-dev.lock

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t snapgen-mcp:ci .
      - name: Runs as an unprivileged user
        run: test "$(docker run --rm --entrypoint id snapgen-mcp:ci -u)" = "10001"
      - name: Start the container and wait until it is healthy
        run: |
          docker run -d --name mcp -p 8000:8000 snapgen-mcp:ci
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' mcp)" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker logs mcp
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install the smoke test dependencies
        run: |
          pip install --require-hashes --no-deps -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Smoke test (no API key in CI, so only the credit-free checks run)
        run: python scripts/smoke_test.py --url http://127.0.0.1:8000
      - name: Container logs
        if: always()
        run: docker logs mcp
